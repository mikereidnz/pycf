[build-system]
requires = [
  "setuptools>=68",
  "wheel>=0.40,<1.0",
  "Cython>=3,<4",
  "numpy>=1.24",
]
build-backend = "setuptools.build_meta"

[project]
name = "pycf-crystalfield"
dynamic = ["version"]
description = "Python crystal field theory modules"
readme = "README.rst"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Mike Reid", email = "mike.reid@canterbury.ac.nz"},
]
maintainers = [
    {name = "Mike Reid", email = "mike.reid@canterbury.ac.nz"},
]
keywords = ["crystal field", "rare earth", "magnetism"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.15",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=7.0",
    "pytest-benchmark>=5.0",
    "hypothesis>=6.0",
    "matplotlib>=3.8",
    "sympy>=1.10",
]
examples = [
    "matplotlib>=3.8",
    "pymatgen>=2024.3",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=7.0",
    "pytest-benchmark>=5.0",
    "hypothesis>=6.0",
    "matplotlib>=3.8",
    "pymatgen>=2024.3",
    "sympy>=1.10",
    "setuptools>=68",
    "wheel>=0.40,<1.0",
    "Cython>=3,<4",
    "black>=23.0",
    "isort>=5.13",
    "flake8>=6.0",
    "mypy>=1.7",
    "bandit>=1.7",
    "semgrep>=1.45",
    "pre-commit>=3.0",
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
    "sphinx-autodoc-typehints>=1.20",
    "sphinx-copybutton>=0.5",
    "sphinxcontrib-napoleon>=0.7",
    "myst-parser>=0.18",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
    "sphinx-autodoc-typehints>=1.20",
    "sphinx-copybutton>=0.5",
    "sphinxcontrib-napoleon>=0.7",
    "myst-parser>=0.18",
]

[project.urls]
Homepage = "https://github.com/mikereidnz/pycf"
Repository = "https://github.com/mikereidnz/pycf"
"Legacy Repository" = "https://bitbucket.org/sebastianhorvath/pycf/"

[tool.setuptools]
include-package-data = true
package-data = {"pycf" = ["*.pyx", "*.pxd"]}

[tool.setuptools.dynamic]
version = {attr = "pycf.__version__"}

# ---------------------------------------------------------------------------
# Legacy-module exemptions
#
# Modules whose first docstring line begins with "LEGACY:" are excluded from
# detailed static analysis.  See CONTRIBUTING.md ("Legacy modules") for the
# convention.  Only security-critical fixes are accepted in these modules;
# all other findings are recorded but not addressed.
#
# Currently legacy: pycf/pyemp.py
# ---------------------------------------------------------------------------

[[tool.mypy.overrides]]
module = "pycf.pyemp"
ignore_errors = true

[tool.coverage.run]
# Legacy module — see "Legacy-module exemptions" note above.
omit = ["pycf/pyemp.py"]

[tool.coverage.report]
# Coverage floor for the non-legacy code. Raise this as coverage improves.
# Current measured coverage (pyemp omitted) is ~83%.
fail_under = 80
show_missing = true
skip_covered = false
