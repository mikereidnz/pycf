[build-system]
requires = [
  "setuptools>=77",
  "wheel>=0.40,<1.0",
  "Cython>=3,<4",
  "numpy>=1.26",
]
build-backend = "setuptools.build_meta"

[project]
name = "pycf"
dynamic = ["version"]
description = "Python crystal field theory modules"
readme = "README.rst"
license = "GPL-3.0-or-later"
authors = [
    {name = "Mike Reid", email = "mike.reid@canterbury.ac.nz"},
]
maintainers = [
    {name = "Mike Reid", email = "mike.reid@canterbury.ac.nz"},
]
keywords = ["crystal field", "rare earth", "magnetism"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    "pytest-cov>=7.0",
    "pytest-benchmark>=5.0",
    "hypothesis>=6.0",
]
examples = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=7.0",
    "pytest-benchmark>=5.0",
    "hypothesis>=6.0",
    "matplotlib>=3.8",
    "setuptools>=68",
    "wheel>=0.40,<1.0",
    "Cython>=3,<4",
    "black>=23.0",
    "isort>=5.0",
    "flake8>=6.0",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/mikereidnz/pycf"
Repository = "https://github.com/mikereidnz/pycf"
"Legacy Repository" = "https://bitbucket.org/sebastianhorvath/pycf/"

[tool.setuptools.dynamic]
version = {attr = "pycf.__version__"}
