# Pre-commit hooks for code quality and consistency
# Install with: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

# External fixture data files (JMCALC/SLJM outputs and any other
# producer-faithful data, including .mi_, .st_, and .txt matrix-element
# files) live under matel/ subdirectories anywhere in the tree. They are
# excluded globally so whitespace-style fixers cannot silently mangle
# them. If you want to preserve sample output from legacy tools (for
# example, output from the legacy pascal programs) byte-for-byte, drop
# it under a matel/ directory and it will be left alone.
#
# Also excluded: backup files (*.backup, *.YYYYMMDD), docs/legacy/
# historical record, plan/ planning notes, and the .coverage runtime
# artefact.
exclude: |
  (?x)^(
    (.*/)?matel/
    |.*\.backup$
    |.*\.\d{8}$
    |docs/legacy/
    |plan/
    |\.coverage$
  )

repos:
  # Code formatting
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3
        args: ['--line-length=100']

  # Import sorting
  - repo: https://github.com/PyCQA/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: ['--profile=black', '--line-length=100']

  # Linting
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        # Configuration is in .flake8 at the repo root.
        additional_dependencies: ['flake8-docstrings']
        # Examples are not currently linted; they are illustrative scripts and
        # will be expanded with new examples from published papers in the
        # future. Tracked separately from library/test cleanup.
        exclude: ^(examples/|docs/legacy/|pycf/cfl\.c$|pycf/__version__\.py$)

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.7.1
    hooks:
      - id: mypy
        stages: ['manual']
        files: ^pycf/.*\.py$
        args: ['--ignore-missing-imports', '--no-error-summary']

  # Security scanning - bandit (Python security)
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.5
    hooks:
      - id: bandit
        args: ['-c', '.bandit', '-r', 'pycf/', 'tests/']
        exclude: ^tests/test_
        # The args above already restrict bandit to pycf/ and tests/; without
        # pass_filenames=false pre-commit appends every staged file to the
        # command line, defeating the scoping.
        pass_filenames: false
        additional_dependencies: ['pbr']

  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1000']
      - id: check-merge-conflict
      - id: debug-statements
      - id: mixed-line-ending
        args: ['--fix=lf']
      - id: detect-private-key

# Configuration for CI integration
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autofix_prs: true
  autoupdate_branch: ''
  autoupdate_commit_msg: '[pre-commit.ci] pre-commit autoupdate'
  autoupdate_schedule: weekly
  skip: []
  submodules: false
