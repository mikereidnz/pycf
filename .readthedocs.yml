# ReadTheDocs configuration for pycf
# See: https://docs.readthedocs.io/en/stable/config-file/v2/

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: '3.11'

python:
  version: '3.11'
  install:
    - requirements: docs/requirements.txt
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/conf.py
  fail_on_warning: false

# Redirect old docs URLs
redirects:
  /en/legacy/*: /

# Cache settings
formats:
  - pdf
  - epub

# Submodules
submodules:
  include: all

# Search engine indexing
search:
  ignore:
    - /customizing-sphinx/
    - /404
