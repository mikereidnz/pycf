# pytest.ini
[pytest]
markers =
    slow: marks tests as slow (automatically skipped unless --runslow is used)
    long_running: marks tests that are too long for unattended slow-test runs (run with --runslow --runlong)
    benchmark: marks performance benchmark tests (run with --benchmark-only)

[coverage:run]
omit =
    pycf/pyemp.py
