# Semgrep security and code quality rules
# See: https://semgrep.dev/r

rules:
  # Python security rules
  - id: python-security-hardcoded-password
    patterns:
      - pattern-either:
          - patterns:
              - pattern: $VAR = "..."
              - metavariable-pattern:
                  metavariable: $VAR
                  patterns:
                    - pattern-either:
                        - pattern: password
                        - pattern: secret
                        - pattern: api_key
                        - pattern: token
          - patterns:
              - pattern: password = "..."

  # Code quality rules
  - id: python-code-quality-unused-imports
    patterns:
      - pattern: import $MODULE
    message: Unused import detected
    severity: WARNING
    exclude-patterns:
      - tests/

  # Crystal field specific rules
  - id: pycf-tensor-name-validation
    patterns:
      - pattern: $X.name = "..."
    message: Ensure tensor names are validated
    severity: WARNING

  # General Python best practices
  - id: python-no-assert-outside-test
    patterns:
      - pattern: assert $X
      - pattern-not-inside: |
          def test_...(...):
              ...
      - pattern-not-inside: |
          if __name__ == "__main__":
              ...
      - pattern-not-inside: tests/
    message: Assertion found outside test code; use explicit error handling
    severity: INFO
    exclude-patterns:
      - tests/
      - conftest.py
