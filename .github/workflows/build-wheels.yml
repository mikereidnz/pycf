name: Build Wheels

on:
  push:
    branches: [ main, devel ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, devel ]

jobs:
  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Linux wheels are not built here. The manylinux images
        # (EL8/EL9) lack nlopt-devel and (on EL9) lapacke.h, and we
        # do not distribute wheels. Linux build/test coverage is
        # provided by ci.yml on Ubuntu across Python 3.10-3.13.
        os: [macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install gsl nlopt openblas lapack

    - name: Install cibuildwheel
      run: |
        python -m pip install --upgrade pip cibuildwheel

    - name: Build wheels
      run: |
        python -m cibuildwheel --output-dir wheelhouse
      env:
        CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
        CIBW_SKIP: "*-win32 *-i686"
        CIBW_BEFORE_BUILD_MACOS: "brew install gsl nlopt openblas lapack && python -m pip install build setuptools wheel cython"
        CIBW_ENVIRONMENT_MACOS: "CFL_CFLAGS='-I/opt/homebrew/opt/gsl/include -I/opt/homebrew/opt/nlopt/include -I/opt/homebrew/opt/openblas/include -I/opt/homebrew/opt/lapack/include' CFL_LDLIBS='-L/opt/homebrew/opt/gsl/lib -L/opt/homebrew/opt/nlopt/lib -L/opt/homebrew/opt/openblas/lib -L/opt/homebrew/opt/lapack/lib -lgsl -lgslcblas -lnlopt -llapacke -llapack -lblas -lopenblas'"
        CIBW_REPAIR_WHEEL_COMMAND_MACOS: ""

    - name: Upload wheels to artifact
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: wheelhouse/

    - name: List wheels
      run: |
        ls -lh wheelhouse/
