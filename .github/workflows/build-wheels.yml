name: Build Wheels

on:
  push:
    branches: [ main, devel ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, devel ]

jobs:
  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install system dependencies (Ubuntu)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libblas-dev liblapack-dev libopenblas-dev libgsl-dev libnlopt-dev
    
    - name: Install system dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install gsl nlopt openblas lapack
    
    - name: Install cibuildwheel
      run: |
        python -m pip install --upgrade pip cibuildwheel
    
    - name: Build wheels
      run: |
        python -m cibuildwheel --output-dir wheelhouse
      env:
        CIBW_BUILD: "cp38-* cp39-* cp310-* cp311-* cp312-* cp313-*"
        CIBW_SKIP: "*-win32 *-i686"
        CIBW_MANYLINUX_X86_64_IMAGE: manylinux2014
        CIBW_MANYLINUX_AARCH64_IMAGE: manylinux2014
        CIBW_BEFORE_BUILD_LINUX: "yum install -y gsl-devel nlopt-devel blas-devel lapack-devel openblas-devel"
        CIBW_ENVIRONMENT_LINUX: "CFL_LDLIBS='-lgsl -lgslcblas -lnlopt -llapacke -llapack -lblas -lopenblas'"
        CIBW_BEFORE_BUILD_MACOS: "brew install gsl nlopt openblas lapack"
        CIBW_ENVIRONMENT_MACOS: "CFL_CFLAGS='-I/opt/homebrew/opt/gsl/include -I/opt/homebrew/opt/nlopt/include -I/opt/homebrew/opt/openblas/include -I/opt/homebrew/opt/lapack/include -I/usr/local/opt/gsl/include -I/usr/local/opt/nlopt/include -I/usr/local/opt/openblas/include -I/usr/local/opt/lapack/include' CFL_LDLIBS='-L/opt/homebrew/opt/gsl/lib -L/opt/homebrew/opt/nlopt/lib -L/opt/homebrew/opt/openblas/lib -L/opt/homebrew/opt/lapack/lib -L/usr/local/opt/gsl/lib -L/usr/local/opt/nlopt/lib -L/usr/local/opt/openblas/lib -L/usr/local/opt/lapack/lib -lgsl -lgslcblas -lnlopt -llapacke -llapack -lblas -lopenblas'"
        CIBW_REPAIR_WHEEL_COMMAND_MACOS: ""
    
    - name: Upload wheels to artifact
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: wheelhouse/
    
    - name: List wheels
      run: |
        ls -lh wheelhouse/
