name: CI

on:
  push:
    branches: [ main, devel ]
  pull_request:
    branches: [ main, devel ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgsl-dev libnlopt-dev libblas-dev liblapack-dev libopenblas-dev liblapacke liblapacke-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel numpy scipy cython pytest pytest-cov coverage
    
    - name: Build and install pycf
      run: |
        pip install -e .
    
    - name: Check imports
      run: |
        python -c "import pycf; print('Import OK')"
        python -c "from pycf import cfl; print('cfl import OK')"
        python -c "from pycf.import_sljm import ImportSLJM; print('import_sljm OK')"
        python -c "from pycf import inten; print('inten import OK')"

    - name: Run Python tests with coverage
      run: |
        python -m pytest tests/ -v --cov=pycf --cov-report=xml --cov-report=term
    
    - name: Check for deprecation warnings
      run: |
        python -m pytest tests/ -v 2>&1 | grep -i deprecat || echo "No deprecation warnings"
    
    - name: Upload coverage to Codecov (Python 3.11 only)
      if: matrix.python-version == '3.11'
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: python-tests
        fail_ci_if_error: false
        verbose: true

  macos-tests:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install system dependencies
      run: |
        brew install gsl nlopt openblas lapack
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install setuptools wheel numpy scipy cython pytest pytest-cov coverage
    
    - name: Build and install pycf
      env:
        CFL_CFLAGS: "-I/opt/homebrew/opt/gsl/include -I/opt/homebrew/opt/nlopt/include -I/opt/homebrew/opt/openblas/include -I/opt/homebrew/opt/lapack/include"
        CFL_LDLIBS: "-L/opt/homebrew/opt/gsl/lib -L/opt/homebrew/opt/nlopt/lib -L/opt/homebrew/opt/openblas/lib -L/opt/homebrew/opt/lapack/lib -lgsl -lgslcblas -lnlopt -llapacke -llapack -lblas -lopenblas"
      run: |
        pip install -e .
    
    - name: Check imports
      run: |
        python -c "import pycf; print('Import OK')"
        python -c "from pycf import cfl; print('cfl import OK')"
        python -c "from pycf.import_sljm import ImportSLJM; print('import_sljm OK')"
        python -c "from pycf import inten; print('inten import OK')"

    - name: Run Python tests
      run: |
        python -m pytest tests/ -v --tb=short 2>&1 | head -200 || true

  c-tests:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgsl-dev libnlopt-dev libblas-dev liblapack-dev libopenblas-dev liblapacke liblapacke-dev
    
    - name: Build C library
      run: |
        make -C cfl clean
        make -C cfl
    
    - name: Run C tests
      run: |
        make -C cfl test

  c-tests-sanitizers:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgsl-dev libnlopt-dev libblas-dev liblapack-dev libopenblas-dev liblapacke liblapacke-dev
    
    - name: Build and run C tests with AddressSanitizer
      env:
        CFL_CFLAGS: "-Wall -O0 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
      run: |
        make -C cfl clean
        make -C cfl
        # Run individual test binaries to detect sanitizer errors
        echo "=== CSR Tests with ASAN ==="
        ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 ./cfl/csr_test || true
        
        echo "=== Hamiltonian Tests with ASAN ==="
        ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 ./cfl/h_test || true
        
        echo "=== Optimization Tests with ASAN ==="
        ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 ./cfl/opt_test || true
        
        echo "=== Spin Hamiltonian Tests with ASAN ==="
        ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 ./cfl/sh_test || true
        
        echo "=== Zeeman Tests with ASAN ==="
        ASAN_OPTIONS=detect_leaks=1:halt_on_error=1 ./cfl/sh_zeeman_test || true

  type-check:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy cython mypy
    
    - name: Check type hints with mypy
      run: |
        mypy pycf/ --ignore-missing-imports --no-error-summary 2>&1 | head -100 || true
        echo "Type checking complete (warnings non-blocking)"

  lint:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint pytest
    
    - name: Lint Python modules
      run: |
        # Check for obvious issues (non-critical)
        python -m pylint pycf/*.py --disable=all --enable=E,F 2>&1 | head -50 || true

  pre-commit:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install pre-commit
      run: |
        python -m pip install --upgrade pip
        pip install pre-commit black isort flake8 mypy
    
    - name: Run pre-commit hooks
      run: |
        pre-commit run --all-files || true
      continue-on-error: true

  security:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install security tools
      run: |
        python -m pip install --upgrade pip
        pip install bandit semgrep
    
    - name: Run bandit security scan
      run: |
        bandit -c .bandit -r pycf/ 2>&1 | head -100 || true
      continue-on-error: true
    
    - name: Run semgrep static analysis
      run: |
        semgrep --config=.semgrep.yml pycf/ 2>&1 | head -100 || true
      continue-on-error: true

  benchmarks:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libgsl-dev libnlopt-dev libblas-dev liblapack-dev libopenblas-dev liblapacke liblapacke-dev
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy cython pytest pytest-benchmark
    
    - name: Build and install pycf
      run: |
        python setup.py install
    
    - name: Run benchmarks
      run: |
        python -m pytest tests/test_benchmarks.py -v --benchmark-only 2>&1 | head -200 || true
      continue-on-error: true
